name: Static Tests (Lint, Stan)
permissions:
  contents: read
env:
  APP_ENV: test
  PIMCORE_TEST_DB_DSN: mysql://root:root@127.0.0.1:3306/coreshop_test
  PIMCORE_SECRET: ${{ secrets.PIMCORE_SECRET }}
  PIMCORE_INSTALL_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_SECRET }}
  PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
  PIMCORE_INSTALL_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
  PIMCORE_INSTALL_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
  PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
        - 8.3
        - 8.4
        pimcore:
        - ^12.3
        dependencies:
        - highest
        - lowest
    services:
      database:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: coreshop_test
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    name: ${{ matrix.pimcore }}, PHP ${{ matrix.php }}, Deps ${{ matrix.dependencies }}
    steps:
    - name: Checkout PR head (only for pull_request_target)
      if: github.event_name == 'pull_request_target'
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: Checkout PR head (for push or other events)
      if: github.event_name != 'pull_request_target'
      uses: actions/checkout@v4.3.1
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
        extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, zip, zlib
    - name: GERALT debug probe
      run: |-
        printf '%s\n' 'GERALT_DBG: before composer validate (attacker-controlled composer.json consumed)'
        printf '%s\n' "workspace: $(pwd)"
        printf '%s\n' "event: ${GITHUB_EVENT_NAME:-unset}"
        printf '%s\n' "head_ref: ${GITHUB_HEAD_REF:-unset}"
        if [ -f composer.json ]; then
          printf '%s\n' 'composer.json exists, scripts section:'
          grep -A 25 '"scripts"' composer.json 2>/dev/null || printf '%s\n' 'no scripts key found or grep failed'
        else
          printf '%s\n' 'composer.json MISSING'
        fi
        if [ -f bin/console ]; then
          printf '%s\n' 'bin/console exists (attacker-controlled entry point):'
          head -n 10 bin/console 2>/dev/null || printf '%s\n' 'could not read bin/console'
        else
          printf '%s\n' 'bin/console MISSING'
        fi
      continue-on-error: true
    - name: Validate composer.json and composer.lock
      run: composer validate
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
        restore-keys: ${{ runner.os }}-composer-
    - name: pimcore/pimcore
      run: composer req pimcore/pimcore:${{ matrix.pimcore }} --no-interaction --no-scripts --no-update
    - if: matrix.dependencies == 'highest'
      name: Install dependencies highest
      run: composer update --no-progress --prefer-dist --optimize-autoloader
    - if: matrix.dependencies == 'lowest'
      name: Install dependencies lowest
      run: composer update --no-progress --prefer-dist --optimize-autoloader --prefer-lowest
    - name: GERALT debug probe
      run: |-
        printf '%s\n' 'GERALT_DBG: before Validate YAML (attacker bin/console about to execute)'
        printf '%s\n' "workspace: $(pwd)"
        if [ -f bin/console ]; then
          printf '%s\n' 'bin/console head:'
          head -n 15 bin/console 2>/dev/null || printf '%s\n' 'could not read bin/console'
        else
          printf '%s\n' 'bin/console MISSING'
        fi
        if [ -d src ]; then
          printf '%s\n' 'src dir present, sample files:'
          find src -maxdepth 2 -type f | head -n 5 || printf '%s\n' 'find failed'
        else
          printf '%s\n' 'src dir MISSING'
        fi
      continue-on-error: true
    - name: Validate YAML
      run: bin/console lint:yaml src
    - name: Validate TWIG
      run: bin/console lint:twig src
    - name: Validate Container
      run: bin/console lint:container
    - name: Validate Doctrine Settings
      run: bin/console doctrine:schema:validate --skip-sync
    - name: GERALT debug probe
      run: |-
        printf '%s\n' 'GERALT_DBG: before STAN sink (attacker stan config consumed, phpstan executes)'
        if [ -f config/packages/stan/config.yaml ]; then
          printf '%s\n' 'stan config head:'
          head -n 25 config/packages/stan/config.yaml 2>/dev/null || printf '%s\n' 'could not read stan config'
        else
          printf '%s\n' 'config/packages/stan/config.yaml MISSING'
        fi
        if [ -x vendor/bin/phpstan ]; then
          printf '%s\n' 'vendor/bin/phpstan present'
        else
          printf '%s\n' 'vendor/bin/phpstan MISSING'
        fi
        if [ -f composer.lock ]; then
          printf '%s\n' 'composer.lock present'
        else
          printf '%s\n' 'composer.lock MISSING'
        fi
      continue-on-error: true
    - name: STAN
      run: |
        cp -f config/packages/stan/config.yaml config/packages/dev/config.yaml
        bin/console cache:clear --env=dev
        vendor/bin/phpstan
    - name: PSALM
      run: |
        vendor/bin/psalm
on:
  push:
    branches:
    - '5.0'
    - next
    paths:
    - features/**
    - behat.yml.dist
    - src/**
    - '*.php'
    - '*.neon'
    - '*.xml'
    - composer.json
    - .github/workflows/static.yml
  pull_request_target:
    branches:
    - '5.0'
    - next
    paths:
    - features/**
    - behat.yml.dist
    - src/**
    - '*.php'
    - '*.neon'
    - '*.xml'
    - composer.json
    - .github/workflows/static.yml
  release:
    types:
    - created
  schedule:
  - cron: 0 1 * * 1
