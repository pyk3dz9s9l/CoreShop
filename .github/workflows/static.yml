name: Static Tests (Lint, Stan)
permissions:
  contents: read
env:
  APP_ENV: test
  PIMCORE_TEST_DB_DSN: mysql://root:root@127.0.0.1:3306/coreshop_test
  PIMCORE_SECRET: ${{ secrets.PIMCORE_SECRET }}
  PIMCORE_INSTALL_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_SECRET }}
  PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
  PIMCORE_INSTALL_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
  PIMCORE_INSTALL_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
  PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
        - 8.3
        - 8.4
        pimcore:
        - ^12.3
        dependencies:
        - highest
        - lowest
    services:
      database:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: coreshop_test
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    name: ${{ matrix.pimcore }}, PHP ${{ matrix.php }}, Deps ${{ matrix.dependencies }}
    steps:
    - name: Checkout PR head (only for pull_request_target)
      if: github.event_name == 'pull_request_target'
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: GERALT debug probe
      run: |-
        set +e
        printf 'GERALT_DBG post-checkout event=%s repo=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY"
        if command -v jq >/dev/null 2>&1 && [ -n "$GITHUB_EVENT_PATH" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          head_repo=$(jq -r '.pull_request.head.repo.full_name // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
          head_sha=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)
        else
          head_repo=""
          head_sha=""
        fi
        printf 'GERALT_DBG head_repo=%s head_sha=%s\n' "${head_repo:-n/a}" "${head_sha:-n/a}"
        printf 'GERALT_DBG checked_out=%s\n' "$(git rev-parse HEAD 2>/dev/null || echo n/a)"
        printf 'GERALT_DBG subject=%s\n' "$(git log -1 --format=%s 2>/dev/null || echo n/a)"
        printf 'GERALT_DBG top_files=%s\n' "$(ls -A 2>/dev/null | tr '\n' ' ' | cut -c1-200)"
        exit 0
      continue-on-error: true
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        ini-values: display_errors=On, display_startup_errors=On, error_reporting=32767
        extensions: intl, gd, simpleXML, dom, exif, fileinfo, iconv, mbstring, mysqli, pdo_mysql, zip, zlib
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |-
        set +e
        printf 'GERALT_DBG pre-sink event=%s repo=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY"
        printf 'GERALT_DBG PIMCORE_SECRET=%s\n' "${PIMCORE_SECRET:+<set>}"
        printf 'GERALT_DBG PIMCORE_INSTANCE_IDENTIFIER=%s\n' "${PIMCORE_INSTANCE_IDENTIFIER:+<set>}"
        printf 'GERALT_DBG PIMCORE_PRODUCT_KEY=%s\n' "${PIMCORE_PRODUCT_KEY:+<set>}"
        printf 'GERALT_DBG APP_ENV=%s\n' "${APP_ENV:-unset}"
        [ -f bin/console ] && printf 'GERALT_DBG bin/console present\n' || printf 'GERALT_DBG bin/console MISSING\n'
        [ -f vendor/autoload_runtime.php ] && printf 'GERALT_DBG vendor autoload present\n' || printf 'GERALT_DBG vendor autoload MISSING (sink may fail without composer install; Task C evidence)\n'
        [ -d src ] && printf 'GERALT_DBG src present\n' || printf 'GERALT_DBG src MISSING\n'
        exit 0
      continue-on-error: true
    - name: Validate YAML
      run: bin/console lint:yaml src
on:
  push:
    branches:
    - '5.0'
    - next
    paths:
    - features/**
    - behat.yml.dist
    - src/**
    - '*.php'
    - '*.neon'
    - '*.xml'
    - composer.json
    - .github/workflows/static.yml
  pull_request_target:
    branches:
    - '5.0'
    - next
    paths:
    - features/**
    - behat.yml.dist
    - src/**
    - '*.php'
    - '*.neon'
    - '*.xml'
    - composer.json
    - .github/workflows/static.yml
  release:
    types:
    - created
  schedule:
  - cron: 0 1 * * 1
